name: solomon-stack

services:
  postgres:
    # Postgres 18 + pgvector (vector search for RAG); same data layout as postgres:18.
    image: pgvector/pgvector:pg18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/18/docker,
      # so mount the parent directory (not /var/lib/postgresql/data).
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init-litellm.sql:/docker-entrypoint-initdb.d/init-litellm.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    command: server -s3
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
    ports:
      - "8333:8333" # S3
      - "9333:9333" # Master
      - "8888:8888" # Filer
    volumes:
      - seaweedfs_data:/data

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092" # for clients on your host machine
    environment:
      # KRaft mode (no ZooKeeper)
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./infra/litellm/.env
    ports:
      - "4000:4000" # OpenAI-compatible API + /health
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080" # HTML UI + JSON API (format=json)
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/healthz || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- Firecrawl (self-hosted): search via SearXNG + scrape pages to markdown ---
  # Used by the AI service for web RAG. API: http://localhost:3002 (no auth locally).
  firecrawl-api:
    image: ghcr.io/firecrawl/firecrawl:latest
    container_name: firecrawl-api
    restart: unless-stopped
    command: node dist/src/harness.js --start-docker
    environment:
      HOST: "0.0.0.0"
      PORT: 3002
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      # Reuse the stack's Redis on its own DB index; dedicated queue Postgres + RabbitMQ.
      REDIS_URL: redis://redis:6379/1
      REDIS_RATE_LIMIT_URL: redis://redis:6379/1
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      POSTGRES_HOST: firecrawl-nuq-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      SEARXNG_ENDPOINT: http://searxng:8080
      # Kept small to fit a laptop's Docker memory; each worker is a Node process.
      NUM_WORKERS_PER_QUEUE: 1
      NUQ_WORKER_COUNT: 2 # default 4; each ~400 MB
      MAX_CONCURRENT_JOBS: 4
      BROWSER_POOL_SIZE: 2
      HARNESS_STARTUP_TIMEOUT_MS: 90000
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      firecrawl-playwright:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-nuq-postgres:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    mem_limit: 3g

  firecrawl-playwright:
    image: ghcr.io/firecrawl/playwright-service:latest
    container_name: firecrawl-playwright
    restart: unless-stopped
    environment:
      PORT: 3000
      MAX_CONCURRENT_PAGES: 4
      BLOCK_MEDIA: "true"
    security_opt:
      - no-new-privileges:true
    mem_limit: 1536m
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=512m

  firecrawl-nuq-postgres:
    image: ghcr.io/firecrawl/nuq-postgres:latest
    container_name: firecrawl-nuq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - firecrawl_nuq_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  firecrawl-rabbitmq:
    image: rabbitmq:3-alpine
    container_name: firecrawl-rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
    name: seaweedfs_data
  rabbitmq_data:
  firecrawl_nuq_data:
